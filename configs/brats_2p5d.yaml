seed: 42

experiment: brats_2p5d_unet

model:
  in_channels: 12
  out_channels: 1
  base_channels: 16
  dropout: 0.15
  attention: true

training:
  epochs: 10
  batch_size: 1
  lr: 0.0002
  weight_decay: 0.00001
  device: cuda
  amp: true

data:
  synthetic: false
  root: /path/to/BraTS
  modalities:
    - t1
    - t1ce
    - t2
    - flair
  num_slices_context: 3
  target_size:
    - 128
    - 128
  max_cached_patients: 2
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15
  modality_dropout: 0.10

loss:
  dice_weight: 1.0
  bce_weight: 0.5
  boundary_weight: 0.2
